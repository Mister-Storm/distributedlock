spring:
  application:
    name: distributedlock
distributedlock:
  node:
    name: ${NODE_NAME:node1}
    url: ${NODE_URL:http://localhost:8080}
    public-url: ${PUBLIC_NODE_URL:${NODE_URL:http://localhost:8080}}
    electionTimeout: 6000
    gossipInterval: ${GOSSIP_INTERVAL:3000}
  raft:
    seeds: ${RAFT_SEEDS:http://localhost:8081,http://localhost:8082}
  expirationTime: 120
  lockCleanupInterval: 3000
  health:
    checkInterval: ${HEALTH_CHECK_INTERVAL:4000}
  chaos:
    enabled: ${CHAOS_ENABLED:false}
    inbound:
      enabled: true
      delayMs: ${CHAOS_INBOUND_DELAY_MS:0}
      mode: ${CHAOS_INBOUND_MODE:NONE}
      offlineMs: ${CHAOS_INBOUND_OFFLINE_MS:5000}
      onlineMs: ${CHAOS_INBOUND_ONLINE_MS:15000}
    outbound:
      enabled: true
      delayMs: ${CHAOS_OUTBOUND_DELAY_MS:0}
      mode: ${CHAOS_OUTBOUND_MODE:NONE}
      offlineMs: ${CHAOS_OUTBOUND_OFFLINE_MS:5000}
      onlineMs: ${CHAOS_OUTBOUND_ONLINE_MS:15000}
server:
  port: ${SERVER_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      show-details: always
